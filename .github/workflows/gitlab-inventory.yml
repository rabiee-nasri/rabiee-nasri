name: gitlab-inventory
on:
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -H "PRIVATE-TOKEN: $GITLAB_TOKEN" "https://gitlab.com/api/v4/projects?membership=true&per_page=100&order_by=last_activity_at&simple=true" \
          | jq -r '.[] | "PROJECT \(.path_with_namespace) | \(.visibility) | created=\(.created_at[:10]) | last=\(.last_activity_at[:10])"'
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
